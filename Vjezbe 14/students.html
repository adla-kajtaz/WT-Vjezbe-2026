<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studnets</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="form-container">
      <h3>Add New Student</h3>
      <div class="form-group">
        <label for="indexNumber">Index:</label>
        <input type="text" id="indexNumber" placeholder="e.g. BB000000" />
      </div>
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" placeholder="Enter last name" />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" placeholder="Enter last name" />
      </div>
      <div class="form-group">
        <label for="dateOfBirth">Date of Birth:</label>
        <input type="date" id="dateOfBirth" />
      </div>
      <div class="form-group">
        <label for="status">Status:</label>
        <input type="text" id="status" placeholder="Redovan/Vandredan" />
      </div>
      <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="text" id="phoneNumber" placeholder="Enter phone number" />
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label for="citySelect">City:</label>
        <select id="citySelect">
          <option value="">-- Select City --</option>
        </select>
      </div>
      <div class="btn-add-container">
        <button onclick="addStudent()">Add Student</button>
      </div>
    </div>
    <div class="controls">
      <button onclick="getAllStudents()">Load all students</button>
      <input
        type="text"
        id="studentNameInput"
        placeholder="Enter the name of the student..."
      />
      <button onclick="getStudentByName()">Search by name</button>
    </div>

    <table id="studentTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Index</th>
          <th>First name</th>
          <th>Last name</th>
          <th>Date of Birth</th>
          <th>Status</th>
          <th>Phone Number</th>
          <th>Email</th>
          <th>City</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Podaci će se ovdje učitati -->
      </tbody>
    </table>
    <dialog id="editDialog">
      <h3 id="dialogTitle">Edit Student</h3>
      <input type="hidden" id="editStudentId" />

      <div class="dialog-form-group">
        <label for="editIndexNumber">Index:</label>
        <input type="text" id="editIndexNumber" />
      </div>
      <div class="dialog-form-group">
        <label for="editFirstName">First Name:</label>
        <input type="text" id="editFirstName" />
      </div>
      <div class="dialog-form-group">
        <label for="editLastName">Last Name:</label>
        <input type="text" id="editLastName" />
      </div>
      <div class="dialog-form-group">
        <label for="editDateOfBirth">Date of Birth:</label>
        <input type="date" id="editDateOfBirth" />
      </div>
      <div class="dialog-form-group">
        <label for="editStatus">Status:</label>
        <input type="text" id="editStatus" />
      </div>
      <div class="dialog-form-group">
        <label for="editPhoneNumber">Phone Number:</label>
        <input type="text" id="editPhoneNumber" />
      </div>
      <div class="dialog-form-group">
        <label for="editEmail">Email:</label>
        <input type="email" id="editEmail" />
      </div>
      <div class="dialog-form-group">
        <label for="editCitySelect">City:</label>
        <select id="editCitySelect">
          <option value="">-- Select City --</option>
        </select>
      </div>

      <div class="dialog-buttons">
        <button class="btn-close" onclick="closeDialog()">Cancel</button>
        <button class="btn-save" onclick="saveStudentChanges()">
          Save Changes
        </button>
      </div>
    </dialog>
  </body>
  <script src="script.js"></script>
</html>
