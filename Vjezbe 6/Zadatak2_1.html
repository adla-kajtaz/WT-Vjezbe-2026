<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <input type="number" id="broj1" placeholder="Unesite prvi broj..." />
      <input type="number" id="broj2" placeholder="Unesite drugi broj..." />
      <button onclick="izracunaj('+')">Saberi</button>
      <button onclick="izracunaj('-')">Oduzmi</button>
      <button onclick="izracunaj('*')">Pomnozi</button>
      <button onclick="izracunaj('/')">Podijeli</button>

      <div id="historija"></div>
    </div>
  </body>
  <script>
    function izracunaj(operacija) {
      const unos1 = document.getElementById("broj1");
      const unos2 = document.getElementById("broj2");
      const historija = document.getElementById("historija");

      const br1 = Number(unos1.value);
      const br2 = Number(unos2.value);
      if (unos1.value === "" || unos2.value === "") {
        alert("Trebate unijeti oba broja da bi se izvrsila operacija!");
        return;
      }

      let rezultat;
      if (operacija === "+") {
        rezultat = br1 + br2;
      } else if (operacija === "-") {
        rezultat = br1 - br2;
      } else if (operacija === "*") {
        rezultat = br1 * br2;
      } else if (operacija === "/") {
        if (br2 === 0) {
          alert("Ne mozemo dijeliti sa nulom");
          return;
        }
        rezultat = br1 / br2;
      }
      historija.innerHTML += br1 + operacija + br2 + "=" + rezultat + "<br/>";
      //historija.innerHTML += `${br1} ${operacija} ${br2} = ${rezultat} <br/>`;
      unos1.value = "";
      unos2.value = "";
    }

    function saberi() {
      const unos1 = document.getElementById("broj1");
      const unos2 = document.getElementById("broj2");
      const historija = document.getElementById("historija");

      const br1 = Number(unos1.value);
      const br2 = Number(unos2.value);
      if (unos1.value === "" || unos2.value === "") {
        alert("Trebate unijeti oba broja da bi se izvrsila operacija!");
        return;
      }

      const rezultat = br1 + br2;
      historija.innerHTML += rezultat + "<br/>";
      unos1.value = "";
      unos2.value = "";
    }

    function oduzmi() {
      const unos1 = document.getElementById("broj1");
      const unos2 = document.getElementById("broj2");
      const historija = document.getElementById("historija");

      const br1 = Number(unos1.value);
      const br2 = Number(unos2.value);
      if (unos1.value === "" || unos2.value === "") {
        alert("Trebate unijeti oba broja da bi se izvrsila operacija!");
        return;
      }

      const rezultat = br1 - br2;
      historija.innerHTML += rezultat + "<br/>";
      unos1.value = "";
      unos2.value = "";
    }

    function pomnozi() {
      const unos1 = document.getElementById("broj1");
      const unos2 = document.getElementById("broj2");
      const historija = document.getElementById("historija");

      const br1 = Number(unos1.value);
      const br2 = Number(unos2.value);
      if (unos1.value === "" || unos2.value === "") {
        alert("Trebate unijeti oba broja da bi se izvrsila operacija!");
        return;
      }

      const rezultat = br1 * br2;
      historija.innerHTML += rezultat + "<br/>";
      unos1.value = "";
      unos2.value = "";
    }

    function podijeli() {
      const unos1 = document.getElementById("broj1");
      const unos2 = document.getElementById("broj2");
      const historija = document.getElementById("historija");

      const br1 = Number(unos1.value);
      const br2 = Number(unos2.value);
      if (unos1.value === "" || unos2.value === "") {
        alert("Trebate unijeti oba broja da bi se izvrsila operacija!");
        return;
      }

      if (br2 === 0) {
        alert("Ne mozemo dijeliti nulom");
        return;
      }

      const rezultat = br1 / br2;
      historija.innerHTML += rezultat + "<br/>";
      unos1.value = "";
      unos2.value = "";
    }
  </script>
</html>
