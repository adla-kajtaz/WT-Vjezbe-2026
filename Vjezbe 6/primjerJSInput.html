<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Input</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 50px;
        background-color: #f4f7f6;
        text-align: center;
      }
      .box {
        max-width: 450px;
        margin: auto;
        padding: 25px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      input {
        padding: 10px;
        width: 60%;
        border: 2px solid #ddd;
        border-radius: 5px;
        outline: none;
      }
      input:focus {
        border-color: #007bff;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
      }
      button:hover {
        background-color: #0056b3;
      }

      #listaPoruka {
        margin-top: 25px;
        text-align: left;
        border-top: 2px solid #eee;
        padding-top: 15px;
      }

      .poruka {
        background: #e9ecef;
        padding: 8px 12px;
        margin-bottom: 8px;
        border-radius: 4px;
        border-left: 4px solid #007bff;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h3>Ispis poruka</h3>
      <input type="text" id="unos" placeholder="Upišite neku poruku..." />
      <button id="dugme">Spremi</button>

      <div id="listaPoruka"></div>
    </div>
  </body>
  <script>
    const inputPolje = document.getElementById("unos");
    const dugme = document.getElementById("dugme");
    const kontejnerZaListu = document.getElementById("listaPoruka");

    dugme.addEventListener("click", function () {
      const tekst = inputPolje.value;

      if (tekst === "") {
        alert("Ne možete dodati praznu poruku!");
        return;
      }

      kontejnerZaListu.innerHTML += tekst + "<br/>";

      inputPolje.value = "";
    });
  </script>
</html>
