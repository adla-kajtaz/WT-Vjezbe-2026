<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="ucitajZadatke()">Učitaj zadatke</button>
    <ul id="lista-zadataka"></ul>
  </body>
  <script>
    async function ucitajZadatke() {
      const response = await fetch(
        "https://jsonplaceholder.typicode.com/todos",
      );
      const tasks = await response.json();

      const lista = document.getElementById("lista-zadataka");
      lista.innerHTML = "";

      tasks.forEach((task) => {
        const stavka = document.createElement("li");
        stavka.textContent = task.title;

        if (task.completed) {
          stavka.style.color = "green";
          stavka.style.textDecoration = "line-through";
        } else {
          stavka.style.color = "red";
        }

        lista.appendChild(stavka);
      });
    }
  </script>
</html>
