<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .controls {
        margin-bottom: 20px;
        border-bottom: 2px solid #eee;
        padding-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <button onclick="getAllUsers()">Učitaj sve korisnike</button>
      <input
        type="text"
        id="userNameInput"
        placeholder="Unesi ime korisnika..."
      />
      <button onclick="getUserByName()">Pretraži po imenu</button>
    </div>
    <table id="userTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Ime</th>
          <th>Email</th>
          <th>Grad</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <!-- Podaci će se ovdje učitati -->
      </tbody>
    </table>
  </body>
  <script>
    async function getAllUsers() {
      const response = await fetch(
        "https://jsonplaceholder.typicode.com/users",
      );
      const users = await response.json();

      const tableBody = document.getElementById("userTableBody");
      tableBody.innerHTML = ""; // Očisti prethodne podatke

      users.forEach((user) => {
        const row = `<tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.address.city}</td>
        </tr>`;
        tableBody.innerHTML += row;
      });
      //prikaziKorisnike(users);
    }

    async function getUserByName() {
      const searchName = document
        .getElementById("userNameInput")
        .value.toLowerCase();
      const response = await fetch(
        "https://jsonplaceholder.typicode.com/users",
      );
      const users = await response.json();

      const filteredUsers = users.filter(
        (user) => user.name.toLowerCase().includes(searchName.toLowerCase()),
        //user.name.toLowerCase().startsWith(searchNametoLowerCase()),
      );
      const tableBody = document.getElementById("userTableBody");
      tableBody.innerHTML = ""; // Očisti prethodne podatke

      filteredUsers.forEach((user) => {
        const row = `<tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.address.city}</td>
        </tr>`;
        tableBody.innerHTML += row;
      });
      //prikaziKorisnike(filteredUsers);
    }

    function prikaziKorisnike(users) {
      const tableBody = document.getElementById("userTableBody");
      tableBody.innerHTML = ""; // Očisti prethodne podatke

      users.forEach((user) => {
        const row = `<tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.address.city}</td>
        </tr>`;
        tableBody.innerHTML += row;
      });
    }
  </script>
</html>
