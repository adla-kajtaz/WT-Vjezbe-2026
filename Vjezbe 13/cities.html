<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cities</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="form-container">
      <h3>Add New City</h3>
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter name" />
      </div>
      <button onclick="addCity()">Add City</button>
    </div>
    <div class="controls">
      <button onclick="getAllCities()">Load all cities</button>
      <input
        type="text"
        id="cityNameInput"
        placeholder="Enter the name of the city..."
      />
      <button onclick="getCityByName()">Search by name</button>
    </div>
    <table id="cityTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="cityTableBody">
        <!-- Podaci će se ovdje učitati -->
      </tbody>
    </table>
    <dialog id="editDialog">
      <h3 id="dialogTitle">Edit City</h3>
      <input type="hidden" id="editCityId" />

      <div class="dialog-form-group">
        <label for="editName">Name:</label>
        <input type="text" id="editName" />
      </div>

      <div class="dialog-buttons">
        <button class="btn-close" onclick="closeDialog()">Cancel</button>
        <button class="btn-save" onclick="saveCityChanges()">
          Save Changes
        </button>
      </div>
    </dialog>
  </body>
  <script src="script.js"></script>
</html>
