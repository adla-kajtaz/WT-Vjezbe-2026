<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        text-align: center;
        background-color: #e0f7fa;
        color: #333;
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .box {
        background-color: #00796b;
        color: white;
        padding: 40px 20px;
        flex: 1;
        border-radius: 8px;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        body {
          background-color: #ffcc80;
        }
      }
      @media (max-width: 600px) {
        .container {
          flex-direction: column;
        }
      }
      @media (max-width: 400px) {
        #treca-kutija {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Design</h1>
    <p>Resize your browser window to see the layout and background change!</p>

    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box" id="treca-kutija">Box 3</div>
    </div>
  </body>
</html>
